android {
    namespace 'com.godot.tub.gd'
    compileSdk 37

    defaultConfig {
        applicationId 'com.godot.tub.gd'
        minSdk 28
        targetSdk 34
        versionCode 10
        versionName '1.0.9'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

